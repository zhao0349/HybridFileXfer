name: Build and verify
on:
  workflow_dispatch:
  push:
    branches: ['main', 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile, test and package desktop
        run: python tools/build_desktop.py --test --package
      - name: Upload desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            .build/distributions/*
            .build/test-results/*
          if-no-files-found: error
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
      - name: Build Android and run unit tests
        working-directory: HybridFileXfer-Android
        run: bash ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Upload Android debug build and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-and-reports
          path: |
            HybridFileXfer-Android/app/build/outputs/apk/debug/*.apk
            HybridFileXfer-Android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
