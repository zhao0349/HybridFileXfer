name: Build and verify
on:
  workflow_dispatch:
    inputs:
      canary:
        description: Publish a canary prerelease after all checks pass (main only)
        type: boolean
        default: false
  push:
    branches: ['main']
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile, test and package desktop
        run: python tools/build_desktop.py --test --package
      - name: Upload desktop distribution
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            .build/distributions/*
            .build/test-results/*
          if-no-files-found: error
          retention-days: 14
      - name: Check legacy Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet build HybridFileXferLauncher/HybridFileXferLauncher.csproj --configuration Release
  canary:
    if: github.event_name == 'workflow_dispatch' && inputs.canary && github.ref == 'refs/heads/main'
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          path: .build/canary-input
      - name: Prepare verified release assets
        run: python tools/prepare_canary.py
      - name: Publish canary
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(cat .build/canary-tag.txt)
          gh release create "$tag" --target "$GITHUB_SHA" --title "HybridFileXfer $tag" --notes-file .build/canary-notes.md --prerelease --draft .build/canary-release/*
          gh release edit "$tag" --draft=false --latest=false
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Build Android and run unit tests
        working-directory: HybridFileXfer-Android
        run: bash ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Upload Android debug build and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-and-reports
          path: |
            HybridFileXfer-Android/app/build/outputs/apk/debug/*.apk
            HybridFileXfer-Android/app/build/reports/
          if-no-files-found: warn
          retention-days: 14
